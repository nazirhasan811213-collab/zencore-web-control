name: ZenCore Marketing Draft Tests
on:
  pull_request:
    paths:
      - 'marketing-control/**'
      - '.github/workflows/marketing-control-tests.yml'
  push:
    branches:
      - 'feature/ai-marketing-founder-approval'
    paths:
      - 'marketing-control/**'
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: marketing-control
