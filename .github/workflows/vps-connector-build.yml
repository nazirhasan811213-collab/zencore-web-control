name: ZenCore VPS 10-user Manager
on:
  workflow_dispatch:
  pull_request:
    paths: ['ea-local-connector/**', '.github/workflows/vps-connector-build.yml', 'scripts/build-vps-ex5.ps1']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test connector and ten-profile isolation
        run: python -m unittest discover -s ea-local-connector -p 'test_*.py'
      - name: Compile ZenCore EA with MetaEditor
        shell: pwsh
        run: ./scripts/build-vps-ex5.ps1
      - name: Build VPS Manager
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.16.0 pillow==11.3.0
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name ZenCoreVPSManager --add-data "dist/ZenCoreExecutor.ex5;." --paths ea-local-connector ea-local-connector/vps_manager.py
          if ($LASTEXITCODE -ne 0) { throw 'Manager build failed' }
          $p = Start-Process dist/ZenCoreVPSManager.exe -ArgumentList '--self-test','--preview' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Manager packaged validation failed' }
          $v = Get-Content dist/vps-validation.json -Raw | ConvertFrom-Json
          if (-not $v.ok -or $v.slots -ne 10 -or $v.eaVersion -ne '2.27' -or $v.managerVersion -ne '1.1.10' -or $v.connectorBuild -ne '2.1.26' -or -not $v.dpapi -or -not $v.compiledEaInstalled) { throw 'Manager validation incomplete' }
      - name: Build and smoke-test installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" ea-local-connector/vps-installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          $dir = Join-Path $env:RUNNER_TEMP 'ZenCore-VPS-Setup-Test'
          $p = Start-Process dist/ZenCoreVPSSetup-1.1.10.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$dir/ZenCoreVPSManager.exe")) { throw 'Installer smoke failed' }
          $p = Start-Process "$dir/ZenCoreVPSManager.exe" -ArgumentList '--self-test','--require-sidecar' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Installed Manager validation failed' }
          $p = Start-Process "$dir/unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Uninstall smoke failed' }
          Copy-Item ea-local-connector/ZenCoreExecutor.mq5,ea-local-connector/PANDUAN_VPS_10_USER.txt,ea-local-connector/VPS_10_USER.csv dist/
          Get-FileHash dist/ZenCoreVPSSetup-1.1.10.exe,dist/ZenCoreVPSManager.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content dist/VPS-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ZenCore-VPS-10-User-Manager
          path: |
            dist/ZenCoreVPSSetup-1.1.10.exe
            dist/ZenCoreExecutor.ex5
            dist/ZenCoreExecutor.mq5
            dist/PANDUAN_VPS_10_USER.txt
            dist/VPS_10_USER.csv
            dist/VPS-SHA256.txt
            dist/vps-validation.json
            dist/VPS-Manager-Preview.png
          if-no-files-found: error
          retention-days: 30
