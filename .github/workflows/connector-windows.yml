name: Universal Connector Windows build
on:
  pull_request:
    paths:
      - 'ea-local-connector/**'
      - '.github/workflows/connector-windows.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Windows protocol and DPAPI tests
        shell: pwsh
        run: |
          $env:PYTHONPATH='ea-local-connector'
          python -m unittest discover -s ea-local-connector -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Build and smoke-test installer
        shell: pwsh
        run: ./ea-local-connector/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ZenCore-Universal-1.26-candidate
          path: |
            dist/ZenCoreSetup-1.26.exe
            dist/ZenCoreExecutor.mq5
            dist/PANDUAN_INSTALL_1.26.txt
            dist/packaging-test.json
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 30
