name: Auto Trade control plane checks

"on":
  pull_request:
    paths:
      - "analysis-alert*"
      - "position-telegram.js"
      - "analysis-telegram.js"
      - "pine-insights.*"
      - "analysis-dual.*"
      - "gold-copilot.js"
      - "home.html"
      - "auth*"
      - "account*"
      - "onboarding*"
      - "admin-handover.js"
      - "admin-vps-setup.js"
      - "admin-setup-context.js"
      - "client-detail.html"
      - "detail.js"
      - "scripts/check-account-handover-ui.cjs"
      - "managed-vps-accounts.js"
      - "login.html"
      - "scripts/check-managed-login-ui.cjs"
      - "register.html"
      - "admin-registrations.*"
      - "admin-telegram*"
      - "ib-demo*"
      - "scripts/check-ib-demo-ui.cjs"
      - "scripts/check-admin-telegram-ui.cjs"
      - "management.js"
      - "scripts/check-registration-ui.cjs"
      - "scripts/check-pine-insights-ui.cjs"
      - "scripts/check-strength-dashboard-ui.cjs"
      - "precision-entry.*"
      - "auto-trade-monitor.css"
      - "viewer-mode.css"
      - "scripts/check-analysis-alert-ui.cjs"
      - "auto-trade-*.js"
      - "record-retention.js"
      - "current-signal-records.js"
      - "signal-outcome-store.js"
      - "results*"
      - "scripts/check-records-ui.cjs"
      - "auto-trade.js"
      - "auto-trade.html"
      - "scripts/check-manual-exit-ui.cjs"
      - "scripts/check-auto-trade-buttons-ui.cjs"
      - "gcp-instance-identity.js"
      - "server-analysis.js"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/autotrade-control-plane-check.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test control plane without cloud credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: zencore_alert_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ZENCORE_ALERT_TEST_DATABASE_URL: postgres://postgres:test-only-password@localhost:5432/zencore_alert_test
    steps:
      - name: Check out reviewed source
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        uses: actions/checkout@v4

      - name: Use supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run server and execution safety tests
        run: npm test

      - name: Install browser test tools
        run: npm install --no-save --package-lock=false playwright@1.58.2

      - name: Select available Chrome or install test browser
        id: browser
        shell: bash
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "ZENCORE_QA_CHROMIUM=$browser_path" >> "$GITHUB_ENV"
            "$browser_path" --version
          else
            npx playwright install --with-deps chromium
          fi

      - name: Check Analysis popup and mobile layout
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node scripts/check-analysis-alert-ui.cjs

      - name: Check Pine insights dual timeframe UI
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node scripts/check-pine-insights-ui.cjs
      - name: Check Strength dashboard and incomplete feed recovery
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node scripts/check-strength-dashboard-ui.cjs

      - name: Check user trade monitoring UI
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node scripts/check-user-trade-ui.cjs

      - name: Check account handover and admin reset
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node scripts/check-account-handover-ui.cjs

      - name: Check Auto Trade button actions and diagnostic failure isolation
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node scripts/check-auto-trade-buttons-ui.cjs

      - name: Check editable manual exit defaults and persistence
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node scripts/check-manual-exit-ui.cjs

      - name: Check managed username login
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node scripts/check-managed-login-ui.cjs

      - name: Check isolated IB demo UI
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node scripts/check-ib-demo-ui.cjs

      - name: Check admin Telegram messaging UI
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node scripts/check-admin-telegram-ui.cjs

      - name: Check registration approval UI
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node scripts/check-registration-ui.cjs

      - name: Check native indicator chart UI
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node scripts/check-indicator-chart-ui.cjs

      - name: Check durable signal records UI
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node scripts/check-records-ui.cjs

      - name: Save Analysis previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-alert-previews
          path: |
            handover-*.png
            ib-demo-*.png
            admin-telegram-*.png
            records-*.png
            native-chart-*.png
            alert-ui-*.png
            pine-ui-*.png
            registration-ui-*.png
            user-trade-*.png
          retention-days: 7
