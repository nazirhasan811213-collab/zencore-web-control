name: Auto Trade control plane checks

"on":
  pull_request:
    paths:
      - "auto-trade-*.js"
      - "gcp-instance-identity.js"
      - "server-analysis.js"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/autotrade-control-plane-check.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test control plane without cloud credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: zencore_alert_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ZENCORE_ALERT_TEST_DATABASE_URL: postgres://postgres:test-only-password@localhost:5432/zencore_alert_test
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4

      - name: Use supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run server and execution safety tests
        run: npm test

      - name: Install browser test tools
        run: npm install --no-save --package-lock=false playwright@1.58.2

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Check Analysis popup and mobile layout
        run: node scripts/check-analysis-alert-ui.cjs

      - name: Save Analysis previews
        uses: actions/upload-artifact@v4
        with:
          name: analysis-alert-previews
          path: alert-ui-*.png
          retention-days: 7
