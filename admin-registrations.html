<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Kelulusan Pendaftaran • ZenCore Errante Admin</title><link rel="stylesheet" href="/workspace-shell.css?v=36.0"><link rel="stylesheet" href="/admin-registrations.css?v=20261014.1"></head><body><main class="registration-admin"><header><div><span class="eyebrow">ZENCORE ERRANTE / ADMIN</span><h1>Kelulusan pendaftaran</h1><p>Semak client baru. Hanya pendaftaran yang diluluskan boleh log masuk.</p></div><a href="/admin">Kembali ke Admin ↗</a></header><section class="registration-controls"><label>Status<select id="registrationFilter"><option value="pending">Menunggu kelulusan</option><option value="approved">Diluluskan</option><option value="rejected">Ditolak</option><option value="all">Semua pendaftaran baru</option></select></label><label>Carian halaman ini<input id="registrationSearch" type="search" placeholder="Nama, e-mel, telefon atau IB"></label><button id="registrationRefresh" type="button">Refresh senarai</button></section><p id="registrationStatus" role="status">Memuatkan pendaftaran…</p><section id="registrationList" class="registration-list" aria-label="Senarai pendaftaran"></section><nav class="registration-pagination" aria-label="Halaman pendaftaran"><button id="registrationPrev" type="button">← Sebelum</button><span id="registrationPage"></span><button id="registrationNext" type="button">Seterusnya →</button></nav><dialog id="registrationReview" aria-labelledby="reviewTitle"><form id="reviewForm"><h2 id="reviewTitle">Semak pendaftaran</h2><p id="reviewClient"></p><p id="reviewNotice"></p><label>Catatan admin (pilihan)<textarea id="reviewReason" maxlength="500" rows="3" placeholder="Catatan keputusan"></textarea></label><p id="reviewStatus" role="status"></p><div class="review-actions"><button id="reviewCancel" type="button">Batal</button><button id="reviewSubmit" type="submit">Sahkan</button></div></form></dialog></main><script src="/admin-registrations.js?v=20261014.1" defer></script><script src="/workspace-shell.js?v=20261014.approval" defer></script></body></html>
