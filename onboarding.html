<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Aktifkan Akaun | ZenCore</title><link rel="stylesheet" href="/auth.css"><link rel="stylesheet" href="/onboarding.css"></head><body><main class="handover-card"><div class="eyebrow">ZENCORE • SERAHAN AKAUN</div><h1 id="handoverTitle">Memuatkan akaun...</h1><p id="handoverLogin"></p><p id="handoverMessage" role="status" aria-live="polite"></p><form id="handoverForm" hidden><label>Nama penuh<input id="fullName" autocomplete="name" maxlength="60" required></label><label>E-mel<input id="contactEmail" type="email" autocomplete="email" maxlength="254" required></label><label>Nombor telefon<input id="phone" type="tel" autocomplete="tel" maxlength="24" required></label><label>Password baharu<input id="newPassword" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><small>Minimum 10 aksara, termasuk huruf dan nombor.</small><label>Sahkan password baharu<input id="confirmPassword" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><button id="completeHandover" class="primary-btn" type="submit">Lengkapkan &amp; aktifkan akaun</button></form><p id="handoverError" role="alert"></p><button id="handoverLogout" class="secondary-btn" type="button">Log keluar</button><p class="note">Tempoh aktif 14 hari bermula selepas profil lengkap. Tetapan trading telah disediakan oleh admin; akaun hanya boleh digunakan selepas langkah ini selesai.</p></main><script src="/onboarding.js" defer></script></body></html>
